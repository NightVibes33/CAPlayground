name: Fix Native Export iOS
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/fix-export-ios.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Fix export compile issues
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/ios/CAPlayground/Features/Editor/ExportView.swift')
          s = p.read_text()
          old = 'struct ExportView: View {'
          new = '@MainActor\nstruct ExportView: View {'
          if s.count(old) != 1: raise SystemExit(f'ExportView declaration count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''                    Toggle(isOn: $confirmed) {
                        Text("I confirm that I created or have permission to use all content in this wallpaper and that I grant the selected license to the exported file.")
                            .font(.caption)
                            .foregroundStyle(.secondary)
                            .fixedSize(horizontal: false, vertical: true)
                    }
                    .toggleStyle(.checkbox)'''
          new = '''                    Button { confirmed.toggle() } label: {
                        HStack(alignment: .top, spacing: 8) {
                            Image(systemName: confirmed ? "checkmark.square.fill" : "square")
                                .foregroundStyle(confirmed ? CATheme.accent : .secondary)
                            Text("I confirm that I created or have permission to use all content in this wallpaper and that I grant the selected license to the exported file.")
                                .font(.caption)
                                .foregroundStyle(.secondary)
                                .fixedSize(horizontal: false, vertical: true)
                            Spacer(minLength: 0)
                        }
                    }
                    .buttonStyle(.plain)'''
          if s.count(old) != 1: raise SystemExit(f'checkbox block count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          Path('.github/workflows/fix-export-ios.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix native export checkbox and actor isolation'
          git push origin HEAD:agent/native-ios-conversion
