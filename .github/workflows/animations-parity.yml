name: Apply Website Animation Inspector Parity
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/animations-parity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Apply exact website animation controls
        shell: bash
        run: |
          echo ' ' | base64 --decode > /tmp/animations.py
          python3 /tmp/animations.py
      - name: Commit animation parity
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match native animation inspector to website controls'
          git push origin HEAD:agent/native-ios-conversion
