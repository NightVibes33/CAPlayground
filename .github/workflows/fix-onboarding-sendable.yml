name: Fix onboarding PreferenceKey concurrency
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/fix-onboarding-sendable.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Make PreferenceKey default immutable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/ios/CAPlayground/Features/Editor/EditorView.swift')
          s = p.read_text()
          old = '    static var defaultValue: [EditorTourTarget: CGRect] = [:]'
          new = '    static let defaultValue: [EditorTourTarget: CGRect] = [:]'
          if s.count(old) != 1:
              raise SystemExit(f'expected one PreferenceKey default, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/fix-onboarding-sendable.yml').unlink()
          PY
      - name: Commit concurrency fix
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix onboarding PreferenceKey concurrency'
          git push origin HEAD:agent/native-ios-conversion
