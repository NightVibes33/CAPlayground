name: Wire Timeline Parity
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/wire-timeline-parity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Wire timeline panel
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          editor = Path('apps/ios/CAPlayground/Features/Editor/EditorView.swift')
          s = editor.read_text()
          pattern = re.compile(r'    private var timelinePanel: some View \{.*?\n    \}\n\n(?=    private var animatedLayerRows:)', re.S)
          replacement = '''    private var timelinePanel: some View {
              WebsiteTimelinePanel(
                  project: $project,
                  selectedID: $selectedID,
                  currentTime: $timelineTime,
                  viewSeconds: $timelineViewSeconds
              )
          }

          '''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'timeline block count={count}')
          editor.write_text(s)

          pbx = Path('apps/ios/CAPlayground.xcodeproj/project.pbxproj')
          p = pbx.read_text()
          replacements = [
              ('\t\tB00000000000000000000026 = {isa = PBXBuildFile; fileRef = C00000000000000000000028; };\n/* End PBXBuildFile section */',
               '\t\tB00000000000000000000026 = {isa = PBXBuildFile; fileRef = C00000000000000000000028; };\n\t\tB00000000000000000000027 = {isa = PBXBuildFile; fileRef = C00000000000000000000029; };\n/* End PBXBuildFile section */'),
              ('\t\tC00000000000000000000028 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Features/Editor/AnimationInspectorPanel.swift; sourceTree = "<group>"; };\n/* End PBXFileReference section */',
               '\t\tC00000000000000000000028 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Features/Editor/AnimationInspectorPanel.swift; sourceTree = "<group>"; };\n\t\tC00000000000000000000029 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Features/Editor/WebsiteTimelinePanel.swift; sourceTree = "<group>"; };\n/* End PBXFileReference section */'),
              ('C0000000000000000000000D, C00000000000000000000028, C0000000000000000000000E,',
               'C0000000000000000000000D, C00000000000000000000028, C00000000000000000000029, C0000000000000000000000E,'),
              ('B00000000000000000000023, B00000000000000000000024, B00000000000000000000025, B00000000000000000000026); runOnlyForDeploymentPostprocessing = 0; };',
               'B00000000000000000000023, B00000000000000000000024, B00000000000000000000025, B00000000000000000000026, B00000000000000000000027); runOnlyForDeploymentPostprocessing = 0; };')
          ]
          for old, new in replacements:
              count = p.count(old)
              if count != 1:
                  raise SystemExit(f'pbx count={count} for {old[:80]!r}')
              p = p.replace(old, new, 1)
          pbx.write_text(p)
          Path('.github/workflows/wire-timeline-parity.yml').unlink()
          PY
      - name: Commit timeline wiring
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Use website-parity timeline in native editor'
          git push origin HEAD:agent/native-ios-conversion
