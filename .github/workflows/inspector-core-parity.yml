name: Apply core Inspector parity
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/inspector-core-parity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Harden and apply core Inspector parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/inspector_core_patch.py')
          s = p.read_text()
          old = 'private enum GradientPointAxis { case x, y }'
          if s.count(old) != 1:
              raise SystemExit(f'GradientPointAxis marker count={s.count(old)}')
          s = s.replace(old, 'private enum GradientPointAxis: Equatable { case x, y }', 1)
          if s.count('.buttonStyle(.plain).underline()') != 2:
              raise SystemExit(f'button underline count={s.count(".buttonStyle(.plain).underline()")}')
          s = s.replace('.buttonStyle(.plain).underline()', '.buttonStyle(.plain)')
          p.write_text(s)
          PY
          python3 .github/inspector_core_patch.py
      - name: Commit core Inspector parity
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match core Inspector tabs to website'
          git push origin HEAD:agent/native-ios-conversion
