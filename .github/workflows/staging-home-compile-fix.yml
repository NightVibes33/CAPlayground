name: Stage Home compiler fix

on:
  push:
    branches: [agent/native-ios-conversion-major-staging]
    paths: [.github/workflows/staging-home-compile-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Home commit count parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/ios/CAPlayground/Features/Home/HomeView.swift')
          s = p.read_text()
          old = 'let digits = tail.prefix(where: { $0.isNumber })'
          new = 'let digits = tail.prefix(while: { $0.isNumber })'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/staging-home-compile-fix.yml
          git config user.name 'CAPlayground Staging Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix staged Home commit count parser'
          git push
