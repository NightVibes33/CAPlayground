name: Apply native Crop interaction parity
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/crop-parity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Apply Crop interaction parity
        run: python3 .github/crop_parity_patch.py
      - name: Commit Crop parity
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match native Crop interaction to website'
          git push origin HEAD:agent/native-ios-conversion
