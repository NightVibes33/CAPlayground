name: Apply remaining native contract fixes
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/parity-contract-fixes.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Apply exact website contract fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # Web reset-password requires 8 characters; keep the underlying native auth method identical.
          replace_once(
              'apps/ios/CAPlayground/Networking/AuthStore.swift',
              'guard password.count >= 6, let token = await validAccessToken() else {\n            error = "Password must be at least 6 characters."',
              'guard password.count >= 8, let token = await validAccessToken() else {\n            error = "Password must be at least 8 characters."'
          )

          # The website Tendies Checker only accepts .tendies, not generic ZIP or .ca files.
          replace_once(
              'apps/ios/CAPlayground/Features/TendiesChecker/TendiesCheckerView.swift',
              '.fileImporter(isPresented: $importing, allowedContentTypes: [.tendies, UTType(filenameExtension: "ca") ?? .zip, .zip], allowsMultipleSelection: false)',
              '.fileImporter(isPresented: $importing, allowedContentTypes: [.tendies], allowsMultipleSelection: false)'
          )
          replace_once(
              'apps/ios/CAPlayground/Features/TendiesChecker/TendiesCheckerView.swift',
              'guard let url = urls.first else { return false }\n                analyse(url)',
              'guard let url = urls.first, url.pathExtension.lowercased() == "tendies" else { return false }\n                analyse(url)'
          )

          # Gallery always opens the submission dialog; the dialog itself owns the signed-out state.
          p = Path('apps/ios/CAPlayground/Features/Wallpapers/WallpapersView.swift')
          s = p.read_text()
          old = '''            if auth.isSignedIn {
                Button { showingSubmission = true } label: {
                    Label("Submit Wallpaper", systemImage: "square.and.arrow.up")
                }.buttonStyle(CAWebButtonStyle(variant: .accent))
            } else {
                NavigationLink { SignInView() } label: {
                    Label("Submit Wallpaper", systemImage: "square.and.arrow.up")
                }.buttonStyle(CAWebButtonStyle(variant: .accent))
            }'''
          new = '''            Button { showingSubmission = true } label: {
                Label("Submit Wallpaper", systemImage: "square.and.arrow.up")
            }.buttonStyle(CAWebButtonStyle(variant: .accent))'''
          if s.count(old) != 1:
              raise SystemExit(f'WallpapersView submit block count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          # SubmitWallpaperDialog itself shows the website's Sign In Required surface.
          p = Path('apps/ios/CAPlayground/Features/Account/DashboardView.swift')
          s = p.read_text()
          old = '''            ScrollView {
                VStack(alignment: .leading, spacing: 20) { content }
                    .padding(20)
            }'''
          new = '''            ScrollView {
                VStack(alignment: .leading, spacing: 20) {
                    if auth.user == nil { signInRequiredContent } else { content }
                }
                .padding(20)
            }'''
          if s.count(old) != 1:
              raise SystemExit(f'Dashboard submission body count={s.count(old)}')
          s = s.replace(old, new, 1)
          marker = '''    private var title: String {
'''
          insert = '''    private var signInRequiredContent: some View {
        VStack(spacing: 16) {
            Text("Sign In Required").font(.title2.weight(.semibold))
            Text("You need to be signed in to submit wallpapers")
                .foregroundStyle(.secondary)
            Text("Please sign in to your account to submit wallpapers to the gallery.")
                .font(.subheadline)
                .foregroundStyle(.secondary)
                .multilineTextAlignment(.center)
            NavigationLink("Sign In") { SignInView() }
                .buttonStyle(CAWebButtonStyle(variant: .accent))
        }
        .frame(maxWidth: .infinity)
        .padding(.vertical, 28)
    }

'''
          if s.count(marker) != 1:
              raise SystemExit(f'Dashboard title marker count={s.count(marker)}')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          Path('.github/workflows/parity-contract-fixes.yml').unlink()
          PY
      - name: Commit contract fixes
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match remaining file and auth contracts to website'
          git push origin HEAD:agent/native-ios-conversion
