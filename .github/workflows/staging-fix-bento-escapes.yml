name: Fix staged bento escapes

on:
  push:
    branches: [agent/native-ios-conversion-major-staging]
    paths: [.github/workflows/staging-fix-bento-escapes.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated Swift escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/ios/CAPlayground/Features/Home/HomeView.swift')
          s = p.read_text()
          assert s.count(r'id: \\.self') == 2
          assert s.count(r'"\\(entry.kind.title) Layer"') == 1
          s = s.replace(r'id: \\.self', r'id: \.self')
          s = s.replace(r'"\\(entry.kind.title) Layer"', r'"\(entry.kind.title) Layer"')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          rm -f .github/workflows/staging-fix-bento-escapes.yml
          git config user.name 'CAPlayground Staging Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix staged bento Swift escaping'
          git push
