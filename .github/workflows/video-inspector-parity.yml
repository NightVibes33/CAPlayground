name: Apply Video inspector state-sync parity
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/video-inspector-parity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Harden and apply Video inspector parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/video_inspector_patch.py')
          s = p.read_text()
          old = 'fps.formatted(.number.precision(.fractionLength(0...2)))'
          if s.count(old) != 1:
              raise SystemExit(f'FPS format marker count={s.count(old)}')
          p.write_text(s.replace(old, 'fps.formatted(.number.precision(.fractionLength(0)))', 1))
          PY
          python3 .github/video_inspector_patch.py
      - name: Commit Video parity
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match Video state sync to website'
          git push origin HEAD:agent/native-ios-conversion
