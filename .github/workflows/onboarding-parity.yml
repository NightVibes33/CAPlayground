name: Apply editor onboarding target parity
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/onboarding-parity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Apply onboarding target parity
        run: python3 .github/onboarding_parity_patch.py
      - name: Commit onboarding parity
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match editor onboarding to website targets'
          git push origin HEAD:agent/native-ios-conversion
