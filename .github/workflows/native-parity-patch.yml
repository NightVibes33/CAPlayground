name: Apply Native Website Parity Corrections
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/native-parity-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Apply exact parity patch
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/parity.py
          python3 /tmp/parity.py
      - name: Commit parity corrections
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match project import and mobile editor behavior to website'
          git push origin HEAD:agent/native-ios-conversion
