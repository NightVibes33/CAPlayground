name: Add Timeline Shift Parity
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/timeline-shift-parity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Add Shift modifier capture and 0.5 second snapping
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          p=Path('apps/ios/CAPlayground/Features/Editor/WebsiteTimelinePanel.swift')
          s=p.read_text()
          def one(old,new):
              global s
              if s.count(old)!=1: raise SystemExit(f'count {s.count(old)} for {old[:80]!r}')
              s=s.replace(old,new,1)
          one('import SwiftUI\n','import SwiftUI\nimport UIKit\n')
          one('    @State private var rulerDragging = false\n','    @State private var rulerDragging = false\n    @State private var shiftDown = false\n')
          one('        .overlay(RoundedRectangle(cornerRadius: 8).stroke(.separator))\n    }\n','        .overlay(RoundedRectangle(cornerRadius: 8).stroke(.separator))\n        .background(TimelineModifierCapture(isShiftDown: $shiftDown).frame(width: 0, height: 0))\n    }\n')
          one('                color: animationColor(animation.keyPath)\n            )','                color: animationColor(animation.keyPath),\n                shiftDown: shiftDown\n            )')
          one('    let color: Color\n\n    @State private var localDuration','    let color: Color\n    let shiftDown: Bool\n\n    @State private var localDuration')
          old=dedent('''
              private func resizeGesture(_ animation: KeyframeAnimationModel) -> some Gesture {
                  DragGesture(minimumDistance: 0)
                      .onChanged { value in
                          if localDuration == nil {
                              startDuration = animation.duration
                              localDuration = animation.duration
                          }
                          let speed = animation.speed
                          let deltaEffective = Double(value.translation.width / max(pxPerSecond, 0.0001))
                          let delta = deltaEffective * speed
                          localDuration = (max(0.1, startDuration + delta) * 10).rounded() / 10
                      }
                      .onEnded { _ in
                          let final = localDuration ?? animation.duration
                          project.root.update(id: layerID) { layer in
                              guard let index = layer.animations.firstIndex(where: { $0.id == animationID }) else { return }
                              layer.animations[index].duration = final
                          }
                          localDuration = nil
                      }
              }
          ''').lstrip('\n')
          new=dedent('''
              private func resizeGesture(_ animation: KeyframeAnimationModel) -> some Gesture {
                  DragGesture(minimumDistance: 0)
                      .onChanged { value in
                          if localDuration == nil {
                              startDuration = animation.duration
                              localDuration = animation.duration
                          }
                          localDuration = calculatedDuration(animation, translation: value.translation.width)
                      }
                      .onEnded { value in
                          let final = calculatedDuration(animation, translation: value.translation.width)
                          project.root.update(id: layerID) { layer in
                              guard let index = layer.animations.firstIndex(where: { $0.id == animationID }) else { return }
                              layer.animations[index].duration = final
                          }
                          localDuration = nil
                      }
              }

              private func calculatedDuration(_ animation: KeyframeAnimationModel, translation: CGFloat) -> Double {
                  let speed = animation.speed
                  let deltaEffective = Double(translation / max(pxPerSecond, 0.0001))
                  let delta = deltaEffective * speed
                  var next = max(0.1, startDuration + delta)
                  if shiftDown { next = (next * 2).rounded() / 2 }
                  return (next * 10).rounded() / 10
              }
          ''').lstrip('\n')
          one(old,new)
          s += dedent('''

              private struct TimelineModifierCapture: UIViewRepresentable {
                  @Binding var isShiftDown: Bool
                  func makeUIView(context: Context) -> TimelineModifierView {
                      let view = TimelineModifierView()
                      view.onModifierChange = { isShiftDown = $0 }
                      DispatchQueue.main.async { _ = view.becomeFirstResponder() }
                      return view
                  }
                  func updateUIView(_ uiView: TimelineModifierView, context: Context) {
                      uiView.onModifierChange = { isShiftDown = $0 }
                  }
              }

              private final class TimelineModifierView: UIView {
                  var onModifierChange: ((Bool) -> Void)?
                  override var canBecomeFirstResponder: Bool { true }
                  override func pressesBegan(_ presses: Set<UIPress>, with event: UIPressesEvent?) {
                      onModifierChange?(event?.modifierFlags.contains(.shift) == true)
                      super.pressesBegan(presses, with: event)
                  }
                  override func pressesChanged(_ presses: Set<UIPress>, with event: UIPressesEvent?) {
                      onModifierChange?(event?.modifierFlags.contains(.shift) == true)
                      super.pressesChanged(presses, with: event)
                  }
                  override func pressesEnded(_ presses: Set<UIPress>, with event: UIPressesEvent?) {
                      onModifierChange?(event?.modifierFlags.contains(.shift) == true)
                      super.pressesEnded(presses, with: event)
                  }
                  override func pressesCancelled(_ presses: Set<UIPress>, with event: UIPressesEvent?) {
                      onModifierChange?(false)
                      super.pressesCancelled(presses, with: event)
                  }
              }
          ''')
          p.write_text(s)
          Path('.github/workflows/timeline-shift-parity.yml').unlink()
          PY
      - name: Commit Shift parity
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match timeline Shift resize snapping to website'
          git push origin HEAD:agent/native-ios-conversion
