name: Apply strict native type fixes
on:
  push:
    branches:
      - agent/native-ios-conversion
    paths:
      - .github/workflows/strict-type-fixes.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Patch exact contracts
        run: |
          set -euo pipefail
          AUTH='apps/ios/CAPlayground/Networking/AuthStore.swift'
          TENDIES='apps/ios/CAPlayground/Features/TendiesChecker/TendiesCheckerView.swift'
          test "$(grep -F -c 'guard password.count >= 6, let token = await validAccessToken() else {' "$AUTH")" = 1
          test "$(grep -F -c 'error = "Password must be at least 6 characters."' "$AUTH")" = 1
          sed -i 's/guard password.count >= 6, let token = await validAccessToken() else {/guard password.count >= 8, let token = await validAccessToken() else {/' "$AUTH"
          sed -i 's/Password must be at least 6 characters\./Password must be at least 8 characters./' "$AUTH"
          test "$(grep -F -c '.fileImporter(isPresented: $importing, allowedContentTypes: [.tendies, UTType(filenameExtension: "ca") ?? .zip, .zip], allowsMultipleSelection: false)' "$TENDIES")" = 1
          sed -i 's/allowedContentTypes: \[\.tendies, UTType(filenameExtension: "ca") ?? \.zip, \.zip\]/allowedContentTypes: [.tendies]/' "$TENDIES"
          python3 -c 'from pathlib import Path; p=Path("apps/ios/CAPlayground/Features/TendiesChecker/TendiesCheckerView.swift"); s=p.read_text(); old="guard let url = urls.first else { return false }\n                analyse(url)"; new="guard let url = urls.first, url.pathExtension.lowercased() == \"tendies\" else { return false }\n                analyse(url)"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          rm .github/workflows/strict-type-fixes.yml
      - name: Commit strict contracts
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match Tendies and password contracts to website'
          git push origin HEAD:agent/native-ios-conversion
