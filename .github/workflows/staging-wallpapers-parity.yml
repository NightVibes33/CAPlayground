name: Stage gallery route parity

on:
  push:
    branches: [agent/native-ios-conversion-major-staging]
    paths: [.github/workflows/staging-wallpapers-parity.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply gallery parity patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
          rm -f .github/workflows/staging-wallpapers-parity.yml
          git config user.name 'CAPlayground Staging Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Stage gallery route and footer parity'
          git push
