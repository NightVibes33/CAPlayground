name: Apply native Geometry inspector parity
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/geometry-parity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Apply Geometry parity
        run: python3 .github/geometry_patch.py
      - name: Commit Geometry parity
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match native Geometry inspector to website'
          git push origin HEAD:agent/native-ios-conversion
