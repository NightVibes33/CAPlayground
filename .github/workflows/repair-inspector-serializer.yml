name: Repair Inspector and serializer compiler errors
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/repair-inspector-serializer.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Apply exact compiler repair
        run: python3 .github/repair_inspector_serializer.py
      - name: Commit compiler repair
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Inspector helpers and fix state serializer compile'
          git push origin HEAD:agent/native-ios-conversion
