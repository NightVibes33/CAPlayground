name: Apply state export parity
on:
  push:
    branches: [agent/native-ios-conversion]
    paths: [.github/workflows/state-export-parity.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-ios-conversion
          fetch-depth: 0
      - name: Apply state serializer parity
        run: python3 .github/state_export_patch.py
      - name: Commit state parity
        run: |
          git config user.name 'CAPlayground Parity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Match state export semantics to website'
          git push origin HEAD:agent/native-ios-conversion
